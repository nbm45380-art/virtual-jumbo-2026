<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOTO6 仮説研究所</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07121d;color:#eaf4ff;font-family:system-ui,-apple-system,sans-serif}.box{width:min(90vw,560px);padding:28px;border:1px solid #29445c;border-radius:20px;background:#0d1d2a}p{color:#b8cada;line-height:1.7}progress{width:100%}#err{color:#ffc8c8;white-space:pre-wrap}button{padding:10px 14px;border:0;border-radius:10px;font-weight:700}</style></head><body><div class="box"><h1>LOTO6 仮説研究所</h1><p id="msg">完全版を起動しています…</p><progress id="bar" max="3" value="0"></progress><p id="err"></p><button id="retry" hidden onclick="location.reload()">再読み込み</button></div><script>(async()=>{const msg=document.getElementById('msg'),bar=document.getElementById('bar'),err=document.getElementById('err'),retry=document.getElementById('retry');try{let s='';for(let i=1;i<=3;i++){msg.textContent=`本体を読み込み中… ${i}/3`;const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);const r=await fetch(`p${i}.txt?v=20260909-direct2`,{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)throw new Error(`本体データ ${i}/3 の取得に失敗 (${r.status})`);s+=(await r.text()).trim();bar.value=i;}if(!('DecompressionStream'in window))throw new Error('このブラウザは展開処理に対応していません');msg.textContent='完全版を展開しています…';const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip');let full=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!full.includes('LOTO6 仮説研究所')||full.length<50000)throw new Error('本体データの検証に失敗しました');const guard=`<script>(()=>{const _f=window.fetch.bind(window);window.fetch=(u,o={})=>{if(o&&o.signal)return _f(u,o);const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);return _f(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t));};})();<\/script>`;full=full.replace('</head>',guard+'</head>');document.open();document.write(full);document.close();}catch(e){msg.textContent='起動に失敗しました';err.textContent=String(e&&e.message||e);retry.hidden=false;}})();</script></body></html>
