<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>LOTO7 仮説研究所</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07121d;color:#eaf4ff;font-family:system-ui,-apple-system,sans-serif}.box{width:min(90vw,560px);padding:28px;border:1px solid #29445c;border-radius:20px;background:#0d1d2a;box-shadow:0 20px 60px #0008}h1{margin:0 0 10px;font-size:clamp(24px,7vw,38px)}p{line-height:1.65;color:#b8cada}progress{width:100%;height:18px}button{padding:10px 16px;border:0;border-radius:10px;font-weight:700}#err{color:#ffc8c8;white-space:pre-wrap}</style></head><body><div class="box"><h1>LOTO7 仮説研究所</h1><p id="msg">完全版を読み込んでいます…</p><progress id="bar" max="3" value="0"></progress><p id="err"></p><button id="retry" hidden onclick="location.reload()">再読み込み</button></div><script>(async()=>{const B='https://raw.githubusercontent.com/nbm45380-art/virtual-jumbo-2026/loto-public-apps-v3/loto-public/full/loto7/';const msg=document.getElementById('msg'),bar=document.getElementById('bar'),err=document.getElementById('err'),retry=document.getElementById('retry');try{let s='';for(let i=1;i<=3;i++){msg.textContent=`完全版を読み込んでいます… ${i}/3`;const r=await fetch(B+'p'+i+'.txt?v=20260909-1',{cache:'no-store'});if(!r.ok)throw new Error('データ片'+i+'の取得に失敗 ('+r.status+')');s+=(await r.text()).trim();bar.value=i;}if(!('DecompressionStream'in window))throw new Error('このブラウザは復元処理に対応していません');msg.textContent='完全版を展開しています…';const bin=atob(s);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const full=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!full.includes('LOTO7 仮説研究所')||full.length<50000)throw new Error('復元データの検証に失敗しました');document.open();document.write(full);document.close();}catch(e){msg.textContent='読み込みに失敗しました';err.textContent=String(e&&e.message||e);retry.hidden=false;}})();</script></body></html>
