<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界のソース図鑑</title><style>body{font-family:system-ui,sans-serif;padding:32px;color:#33281f;background:#faf7f1}.load{max-width:520px;margin:15vh auto;text-align:center}.bar{height:8px;border-radius:8px;background:#e6ddd0;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:15%;background:#9d4c35;animation:a 1.4s infinite alternate}@keyframes a{to{width:85%}}</style></head><body><div class="load"><h1>世界のソース図鑑</h1><p>読み込んでいます…</p><div class="bar"><i></i></div></div><script>(async()=>{try{let parts=await Promise.all(['p0.txt','p1.txt','p2.txt','p3.txt','p4.txt','p5.txt'].map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));let s=parts.join(''),a=[],q=0,k=0,n=123761;for(let c of s){q=(q<<15)|(c.charCodeAt(0)-0x4e00);k+=15;while(k>=8){k-=8;a.push((q>>k)&255);q&=(1<<k)-1}}let u=Uint8Array.from(a.slice(0,n));let d=new DecompressionStream('gzip');let h=await new Response(new Blob([u]).stream().pipeThrough(d)).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="load"><h1>読み込みに失敗しました</h1><p>ページを再読み込みしてください。</p></div>';console.error(e)}})()</script></body></html>
